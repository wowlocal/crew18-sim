name: Infrastructure checks
on:
  push:
    paths: ['infra/**', 'scripts/build-submission.sh', '.github/workflows/**']
  pull_request:
    paths: ['infra/**', 'scripts/build-submission.sh', '.github/workflows/**']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install uv==0.12.10
      - run: uv sync --project infra/control-plane --locked
      - run: uv run --project infra/control-plane --locked pytest -q
      - run: bash -n scripts/build-submission.sh
      - run: docker compose --env-file infra/deploy/.env.example -f infra/deploy/compose.yaml config --quiet
      - run: docker build -t crew-control-check infra/control-plane
